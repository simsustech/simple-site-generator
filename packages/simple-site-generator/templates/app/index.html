<!doctype html>
<html lang="en">
  <head>
    <!--
      `charset` must stay first: the encoding has to be declared inside the
      first 1 KiB, and the SSR-collected meta tags are injected at the END of
      `<head>` (see the vitrify `injectSsrContext` fix) so they cannot push this
      line out of that window.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fonts are loaded from a CDN by the preset's web-fonts preset; connecting
      early avoids an extra round-trip on the critical path.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- `Meta` owns the <title>. A static one here would be a second <title> in
         the built HTML, which `ssg verify` rejects (and which makes a crawler
         pick arbitrarily between them). -->
  </head>

  <body>
    <!-- A body opening and closing tag is sufficient for Vitrify -->
    <div id="app"></div>
  </body>
</html>
