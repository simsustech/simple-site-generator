packages:
  - 'packages/*'

overrides:
  typescript: '^6.0.3'
  # A single Vue copy, workspace-wide. Without this the root Vitest config
  # compiles the templates' SFCs against one Vue build while the components
  # import another, and rendering a slot throws
  # "Cannot read properties of null (reading 'ce')" — the classic duplicate-Vue
  # instance failure.
  vue: '^3.5.44'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - happy-dom@21.0.4
  - sass@1.106.0
  - vite@8.3.5
  - vitrify@0.29.0 || 0.30.1 || 0.31.0 || 0.32.0
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0
  - fastify@5.12.8
