packages:
  - 'packages/*'

overrides:
  '@simple-site-generator/templates': workspace:*
  # TypeScript 7 is the native (Go) port and no longer ships the JS API
  # (`typescript` resolves to a version stub, so `ts.sys` is gone).
  # @vue/compiler-sfc needs it to resolve imported types in defineProps()/
  # defineEmits(), so pin to the newest release that still exposes it.
  typescript: '^6.0.3'
  # A single Vue copy, workspace-wide. Without this the root Vitest config
  # compiles the templates' SFCs against one Vue build while the components
  # import another, and rendering a slot throws
  # "Cannot read properties of null (reading 'ce')" — the classic duplicate-Vue
  # instance failure.
  vue: '^3.5.43'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - happy-dom@21.0.4
  - sass@1.106.0
  - vite@8.3.5
  - vitrify@0.29.0
